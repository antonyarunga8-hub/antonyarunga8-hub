name: Update Profile README

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-readme:
    name: Auto-update README
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate README exists
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          echo "✅ README.md found"

      - name: Check for changes
        id: check_changes
        run: |
          git diff --name-only HEAD~1 HEAD || true
          echo "changed=$(git diff --name-only HEAD~1 HEAD | grep README.md | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit and push updated README
        if: steps.check_changes.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update profile README [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: echo "✅ Profile README pipeline complete!"
